; =============================================================
; GeoScan3D v8.0 — M5Stack CoreS3 + ADS1256 + Dual FG-3C
; PlatformIO project file (SPEC §1)
; =============================================================

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    ; 0 = إسكان ضجيج النواة (sd_diskio/vfs_api) — رسائل Serial الخاصة بالتطبيق تبقى تعمل
lib_ldf_mode = deep+
lib_deps =
    m5stack/M5Unified@^0.2.5
    m5stack/M5CoreS3@^1.0.0
    ; ملاحظة: M5CoreS3 v1.x غلاف فوق M5Unified — يجب إدراج الاثنتين معاً
    ; إن فشل جلب M5Unified@^0.2.5 جرّب: m5stack/M5Unified
